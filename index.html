<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Відгуки Кебабця</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: laptop (Telegram Desktop full screen, from 761px) = sidebar + page; phone = top bar + bottom tab bar.
   Complaint card = right drawer on a laptop, bottom sheet on a phone. Pickers and forms open over the page.
   Own palette (violet accent, ink for the active item); light or dark follows Telegram. */
:root{
  --page:#F3F2F7; --card:#FFFFFF; --card2:#F7F6FA; --fg:#16141F; --fg2:#4A4757; --hint:#8D8A99; --line:#ECEBF1;
  --ink:#16141F; --ink-fg:#FFFFFF;
  --acc:#6D3BF5; --acc-soft:#EFE9FF; --acc-fg:#5A2DE0;
  --bad:#E5484D; --bad-soft:#FDECEC; --warn:#D9822B; --warn-soft:#FDF1E3; --good:#1F9D5C; --good-soft:#E3F5EB;
  --shade:rgba(22,20,31,.42); --shadow:0 1px 2px rgba(22,20,31,.04),0 8px 24px rgba(22,20,31,.06);
  --font:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top-gap:calc(env(safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
}
.dark{
  --page:#0E0D13; --card:#18171F; --card2:#201F29; --fg:#F2F1F6; --fg2:#C3C0CF; --hint:#7F7C8C; --line:#262531;
  --ink:#F2F1F6; --ink-fg:#16141F;
  --acc:#8B66FF; --acc-soft:#251E3D; --acc-fg:#B39DFF;
  --bad:#FF6B6F; --bad-soft:#3A1F24; --warn:#F0A04B; --warn-soft:#352819; --good:#3CC57F; --good-soft:#17301F;
  --shade:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{padding-top:var(--top-gap)}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--top-gap);z-index:35;background:var(--page)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--hint)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:calc(100vh - var(--top-gap))}
.side{position:sticky;top:var(--top-gap);height:calc(100vh - var(--top-gap));padding:18px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--card);overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:4px 8px 16px}
.brand img{height:50px;width:auto;display:block}
.brand span{font-size:12px;color:var(--hint)}
.lh-d{display:none!important}.dark .lh-l{display:none!important}.dark .lh-d{display:block!important}
.mk{border-radius:50%;background:#fff;display:block;object-fit:contain;flex:none}
.new{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;margin:0 2px 14px;flex:none}
.nv{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--fg2);font-weight:500;width:100%;flex:none}
.nv .i{color:var(--hint)}
.nv:not(.on):hover{background:var(--card2)}
.nv.on{background:var(--ink);color:var(--ink-fg)}
.nv.on .i{color:var(--ink-fg)}
.nv .cnt{margin-left:auto;font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:1px 7px}
.nv.on .cnt{background:rgba(255,255,255,.16);color:inherit}
.dark .nv.on .cnt{background:rgba(0,0,0,.12)}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--card2);margin-top:6px;flex:none}
.ava{width:30px;height:30px;border-radius:50%;background:var(--acc-soft);color:var(--acc-fg);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.me b{display:block;font-size:13px;font-weight:600;line-height:1.2}.me span{font-size:12px;color:var(--hint)}

.main{min-width:0;padding:20px 24px 28px;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph .tt{flex:1;min-width:200px}
.crumb{font-size:12.5px;color:var(--hint);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.crumb button{color:var(--hint)}
.crumb button:hover{color:var(--acc-fg)}
.crumb .i{width:14px;height:14px}
.ph h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ph .sub{color:var(--hint);font-size:13px;margin-top:3px}
.month{display:flex;align-items:center;height:36px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.month>button:not(.mlbl){width:32px;height:34px;display:grid;place-items:center;color:var(--hint)}
.month>button:disabled{opacity:.3}
.month .mlbl{font-weight:600;padding:0 4px;min-width:112px;text-align:center;height:34px}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.btn2 .i{width:16px;height:16px;color:var(--hint)}
.btnk{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:12px;background:var(--ink);color:var(--ink-fg);font-weight:600;white-space:nowrap}
.btnk .i{width:16px;height:16px}
.btna{background:var(--acc);color:#fff}
.btnk:disabled,.btn2:disabled{opacity:.45}
.wide{width:100%}

.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.ch-h{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.ch-h h2{margin:0;font-size:14.5px;font-weight:700;flex:1;min-width:0}
.lk{color:var(--acc-fg);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.lk .i{width:15px;height:15px}
.hn{color:var(--hint);font-size:12.5px;font-weight:500}
.note{padding:0 16px 12px;font-size:12.5px;color:var(--hint)}
.empty{padding:22px 16px;text-align:center;color:var(--hint);font-size:13.5px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:14px 16px;min-width:0;position:relative}
button.kpi{width:100%}
button.kpi:hover{background:var(--card2)}
.kpi:first-child{border-radius:16px 0 0 16px}.kpi:last-child{border-radius:0 16px 16px 0}
.kpi+.kpi::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--line)}
.kpi .l{font-size:12.5px;color:var(--hint);font-weight:500}
.kpi .v{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.kpi .v b{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi .v small{font-size:14px;color:var(--hint);font-weight:600}
.kpi .s{font-size:12px;color:var(--hint);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:3px;border-radius:7px;padding:1px 6px;font-size:12px;font-weight:700;line-height:18px;white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.flat{background:var(--card2);color:var(--hint)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px 2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:3px;background:currentColor}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.late{background:var(--bad-soft);color:var(--bad)}

/* grid rows */
.row{display:grid;gap:16px;align-items:stretch}
.r-6040{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.r-half{grid-template-columns:repeat(2,minmax(0,1fr))}
.r-cab{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card.fill{display:flex;flex-direction:column}
.col>.card.fill{flex:1}
.card.fill>.bars{flex:1;justify-content:space-around}
.card.fill>.chart{flex:1;display:flex;flex-direction:column}
.card.fill>.chart .cbars{flex:1;min-height:118px}
.card.fill>.list{flex:1}

/* channel badge */
.cb{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:#fff;letter-spacing:-.02em;position:relative;padding:0}
.cb.sm{width:22px;height:22px;border-radius:7px;font-size:9.5px}
.cb>svg{width:62%;height:62%}
.cb[title=Bolt]>svg{width:90%;height:90%}
.cb .our{width:86%;height:86%;object-fit:contain}
.cb .sub{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--card)}
.cb.sm .sub{width:11px;height:11px}
.cb .sub svg{width:78%;height:78%}

/* queue rows */
.q{display:flex;gap:11px;padding:10px 16px;align-items:flex-start;border-top:1px solid var(--line);width:100%}
.q:hover,.at:hover,tr.go:hover td{background:var(--card2)}
.list>.q:first-child,.list>.at:first-child{border-top:0}
.q .b{flex:1;min-width:0}
.q .t1{display:flex;gap:8px;align-items:baseline}
.q .t1 b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.q .t1 span{margin-left:auto;font-size:12px;color:var(--hint);white-space:nowrap}
.q .t1 span.late{color:var(--bad);font-weight:700}
.q .t1 span.ok{color:var(--good);font-weight:600}
.q .tx{font-size:13px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}

/* attention rows */
.at{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);width:100%}
.at .b{flex:1;min-width:0}
.at b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at .why{font-size:12.5px;color:var(--hint)}
.at .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.at .ico.bad{background:var(--bad-soft);color:var(--bad)}
.at .ico.warn{background:var(--warn-soft);color:var(--warn)}
.at .ico.good{background:var(--good-soft);color:var(--good)}
.at .ico .i{width:16px;height:16px}
.chev{color:var(--hint);display:inline-grid}
.chev .i{width:16px;height:16px}

/* bars */
.bars{padding:2px 16px 14px;display:flex;flex-direction:column;gap:9px}
.bar{display:grid;min-height:22px;grid-template-columns:minmax(0,172px) 1fr 30px;gap:10px;align-items:center;font-size:13px;width:100%}
.bar:hover .k span{color:var(--acc-fg)}
.bar .k{display:flex;align-items:center;gap:8px;min-width:0}
.bar .k span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.bar .n{text-align:right;font-weight:700}
.bars.topics .tr i{background:var(--warn)}

/* tabs + toolbar */
.tb{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.tb h2{margin:0;font-size:14.5px;font-weight:700}
.seg{display:inline-flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:30px;padding:0 11px;border-radius:9px;font-weight:600;font-size:13px;color:var(--hint);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--hint);opacity:.85}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dark .seg button.on{background:#2C2B37}
.search{flex:1;display:flex;align-items:center;gap:8px;height:34px;border-radius:11px;background:var(--card2);padding:0 11px;color:var(--hint);min-width:140px;max-width:260px;margin-left:auto}
.search .i{width:16px;height:16px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:13.5px;color:var(--fg);outline:0;padding:0}
.flt{height:34px}
.flt b{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.flt.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-fg)}

/* table */
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--hint);text-align:left;padding:8px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card2)}
th:first-child,td:first-child{padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
th.r,td.r{text-align:right}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.go{cursor:pointer}
tr.sel td{background:var(--acc-soft)!important}
td .nm{font-weight:600;font-size:13.5px;line-height:1.25}
td .nk{font-size:12px;color:var(--hint)}
td .big{font-weight:700;font-size:15px}
.zero{color:var(--hint);font-weight:500}
.gcell{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.gcell .was{font-size:12px;color:var(--hint);white-space:nowrap}
.ratio{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.ratio small{font-size:11.5px;color:var(--hint)}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px}
.spark i{width:5px;border-radius:2px;background:var(--line)}
.spark i.cur{background:var(--acc)}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--hint)}
.stars{color:#F5A623;letter-spacing:1px;font-size:12px;white-space:nowrap}
td .what{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--fg2)}
.tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;color:var(--fg2);background:var(--card2);border-radius:6px;padding:1px 6px}
.byw{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap}
.byw .ava{width:24px;height:24px;font-size:10px}
.byw.auto .ava{background:var(--card2);color:var(--hint)}

/* chart */
.chart{padding:4px 16px 14px}
.cbars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:118px}
.cbar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cbar i{width:100%;max-width:34px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--card2) 0 4px,var(--line) 4px 6px)}
.cbar.cur i{background:var(--acc)}
.cbar b{font-size:12px;font-weight:700}
.cbar.cur b{color:var(--acc-fg)}
.clbl{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:6px;font-size:11.5px;color:var(--hint);text-align:center}

/* Google block */
.gbig{display:flex;align-items:center;gap:14px;padding:4px 16px 12px}
.gbig .val{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.gbig .val small{font-size:15px;color:var(--hint);font-weight:600}
.gbig .ex{font-size:12.5px;color:var(--hint);margin-top:4px}
.gline{padding:0 12px 8px}
.gline svg{display:block;width:100%;height:auto}
.gline text{fill:var(--hint);font-size:10px;font-family:var(--font)}

/* overlays: drawer (complaint) and modal (forms, pickers) */
.shade{position:fixed;inset:0;background:var(--shade);opacity:0;transition:opacity .18s}
.shade.show{opacity:1}
.drawer,.modal{position:fixed;background:var(--card);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);transition:transform .2s ease-out,opacity .2s}
.drawer{top:calc(var(--top-gap) + 10px);right:10px;bottom:10px;width:440px;max-width:calc(100vw - 20px);border-radius:18px;transform:translateX(30px);opacity:0}
.modal{left:50%;top:50%;width:560px;max-width:calc(100vw - 32px);max-height:calc(100vh - var(--top-gap) - 32px);border-radius:18px;transform:translate(-50%,-47%);opacity:0;margin-top:calc(var(--top-gap) / 2)}
.modal.narrow{width:420px}
.drawer.show{transform:none;opacity:1}
.modal.show{transform:translate(-50%,-50%);opacity:1}
.dr-h{display:flex;align-items:flex-start;gap:8px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dr-h .tt{flex:1;min-width:0}
.dr-h .id{font-size:11.5px;letter-spacing:.06em;color:var(--hint);font-weight:700;text-transform:uppercase}
.dr-h h3{margin:2px 0 0;font-size:17px;font-weight:700;line-height:1.25}
.rnd{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--fg2);flex:none}
.rnd:disabled{opacity:.35}
.rnd .i{width:16px;height:16px}
.dr-b{flex:1;overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.dr-f{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.dr-f .sp{flex:1;font-size:12px;color:var(--hint);min-width:0}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini>div{background:var(--card2);border-radius:12px;padding:10px 12px;min-width:0}
.mini .l{font-size:11.5px;color:var(--hint);font-weight:600}
.mini b{display:flex;align-items:center;gap:6px;font-size:13.5px;margin-top:2px;line-height:1.3}
.mini .s{font-size:12px;color:var(--hint)}
.mini button{display:inline-block;font-size:12.5px;font-weight:600;color:var(--acc-fg);margin-top:4px}
.lbl{font-size:12.5px;font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.lbl .req{color:var(--bad)}
.lbl .opt-n{color:var(--hint);font-weight:500}
.quote{background:var(--card2);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.45;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.photo-b{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--hint)}
.photo-b img{width:100%;border-radius:12px;display:block}
.thumb{width:44px;height:58px;border-radius:8px;background:var(--acc-soft);color:var(--acc-fg);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
textarea,.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.45;color:var(--fg);background:var(--card)}
textarea{min-height:76px;resize:vertical;display:block}
textarea:focus,.inp:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ai-f{background:var(--acc-soft)!important;border-color:transparent!important}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);font-size:13.5px;font-weight:500;width:100%}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.opt.on{border-color:var(--acc);background:var(--acc-soft);font-weight:600}
.opt.on .rd{border:5px solid var(--acc)}
.who{display:flex;gap:6px;flex-wrap:wrap}

.tl{display:flex;flex-direction:column;padding-left:4px}

.tl div::before{content:"";position:absolute;left:0;top:5px;width:8px;height:8px;border-radius:50%;background:var(--line);box-shadow:0 0 0 3px var(--card)}
.tl div:first-child::before{background:var(--acc)}
.tl div::after{content:"";position:absolute;left:3.5px;top:14px;bottom:0;width:1px;background:var(--line)}
.tl div:last-child{padding-bottom:0}
.tl div:last-child::after{display:none}
.tl small{display:block;color:var(--hint);font-size:12px}
.drop{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--acc);background:var(--acc-soft);border-radius:14px;padding:10px 12px;cursor:pointer;position:relative}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop .thumb{width:40px;height:52px;background:var(--card)}
.drop .tx{flex:1;min-width:0}
.drop b{display:block;font-size:13.5px}
.drop span{font-size:12.5px;color:var(--fg2)}
.ai{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--acc-fg);white-space:nowrap}
.ai .i{width:15px;height:15px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{text-align:left;display:flex;align-items:center;gap:8px;height:40px;border-radius:11px;border:1px solid var(--line);padding:0 12px;font-size:13.5px;font-weight:500;width:100%;background:var(--card)}
.pick span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.empty span{color:var(--hint)}
.pick .i{width:16px;height:16px;color:var(--hint)}
input.pick{font:inherit;font-size:13.5px;color:var(--fg)}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.chs button{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600}
.chs button.on{border-color:var(--acc);background:var(--acc-soft)}

.info{background:var(--acc-soft);color:var(--acc-fg);border-radius:12px;padding:10px 12px;font-size:13px}
.li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;font-size:14px}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}
.li .tx small{display:block;font-size:12px;color:var(--hint)}
.li .ck{color:var(--acc);font-weight:700}
.li.on{color:var(--acc-fg);font-weight:600}
.li .lk2{color:var(--acc-fg);font-weight:600;font-size:13px;flex:none}
.li .ic{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--fg2);flex:none}
.li .ic .i{width:16px;height:16px}
.sect{font-size:12px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:200;width:max-content;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1}

/* collabs */
.cl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cc{padding:16px;display:flex;flex-direction:column;gap:10px}
.cc .top{display:flex;align-items:center;gap:10px}
.cc .top b{display:block;font-size:14px}
.cc .top span{font-size:12px;color:var(--hint)}

.cc dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}

.cc dt{font-size:11.5px;color:var(--hint);font-weight:600}

function shiftMk(mk,by){var y=+mk.slice(0,4),m=+mk.slice(5,7)-1+by;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+"-"+String(m+1).padStart(2,"0")}

function ingest(){

  D.locations.forEach(function(l){LOCBY[l.name]=l;LOCNAME[l.id]=l.name});
  WHO=D.who||[];PEOPLE=D.people||{};
  items=D.items.filter(function(r){return LOCNAME[r.location_id]}).map(function(r){var mk=r.happened_on.slice(0,7);
    return {id:r.id,m:MK.indexOf(mk),day:+r.happened_on.slice(8,10),loc:LOCNAME[r.location_id],ch:r.channel,text:r.text,themes:r.topics||[],result:r.result,solution:r.solution,who:r.who,

  G={};D.google.forEach(function(g){var n=LOCNAME[g.location_id];if(!n)return;var i=MK.indexOf(String(g.month).slice(0,7));if(i<0)return;

function parts(l){var L=LOCBY[l]||{},city=L.city||"",m=/^(.*?)(?:\s*\(([^)]*)\))?\s*$/.exec(l),base=m[1],nick=m[2]||"";

function age(r){var start=r.created&&r.source!=="sheet"?kyivDay(r.created):r.date;if(r.date>start)start=r.date;return Math.max(0,daysBetween(start,ME.today))}

function openPanel(o){
  var z=50+stack.length*2,sh=document.createElement("div"),el=document.createElement("div");
  sh.className="shade";sh.style.zIndex=z;el.className=(o.kind||"modal")+(o.narrow?" narrow":"");el.style.zIndex=z+1;
  el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",o.title);
  el.innerHTML='<div class="dr-h"><div class="tt">'+(o.id?'<div class="id">'+o.id+'</div>':"")+'<h3>'+esc(o.title)+'</h3></div>'+(o.tools||"")+'<button class="rnd" data-close aria-label="Закрити">'+I("x")+'</button></div><div class="dr-b">'+o.body+'</div>'+(o.foot?'<div class="dr-f">'+o.foot+'</div>':"");
  document.body.appendChild(sh);document.body.appendChild(el);stack.push([sh,el,o.onClose]);

}

function shrink(file){ // phone screenshots are large; 1600px is enough to read text and keeps uploads fast
  return new Promise(function(res,rej){var img=new Image(),url=URL.createObjectURL(file);img.onload=function(){var k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);var d=c.toDataURL("image/jpeg",0.85);res({preview:d,data:d.split(",")[1],mime:"image/jpeg"})};img.onerror=rej;img.src=url});
}

  if((b=t.closest("[data-golist]"))){S.tab="queue";S.loc=null;S.q={st:b.dataset.golist,loc:null,ch:null,text:""};render();window.scrollTo(0,0);return}
  if((b=t.closest("[data-ch]"))){S.tab="queue";S.loc=null;S.q={st:"all",loc:null,ch:b.dataset.ch,text:""};render();window.scrollTo(0,0);return}
  if((b=t.closest("[data-topic]"))){S.tab="queue";S.loc=null;S.q={st:"all",loc:null,ch:null,topic:b.dataset.topic,text:""};render();window.scrollTo(0,0);return}
  if((b=t.closest("[data-hseg]"))){S.home.seg=b.dataset.hseg;render();return}
  if((b=t.closest("[data-qst]"))){S.q.st=b.dataset.qst;render();return}
  if(t.closest("[data-qloc]")){locPick(S.q.loc,function(v){S.q.loc=v;render()},"Усі точки");return}
  if(t.closest("[data-qch]")){chPick(ME.allChannels,S.q.ch,function(v){S.q.ch=v;render()},"Усі канали");return}
  if(t.closest("[data-qtopic]")){S.q.topic=null;render();return}
  if((b=t.closest("[data-lseg]"))){S.locs.seg=b.dataset.lseg;render();return}
  if((b=t.closest("[data-lsort]"))){S.locs.sort=b.dataset.lsort;render();return}
  if((b=t.closest("[data-cst]"))){S.cab.st=b.dataset.cst;render();return}
  if(t.closest("[data-cch]")){var mine=inM(5).filter(function(r){return r.loc===S.loc}),cl=Object.keys(count(mine,function(r){return r.ch}));chPick(cl,S.cab.ch,function(v){S.cab.ch=v;render()},"Усі канали");return}
  if((b=t.closest("[data-cchv]"))){S.cab.ch=b.dataset.cchv;S.cab.st="all";render();return}
  if((b=t.closest("[data-ctopic]"))){S.tab="queue";S.q={st:"all",loc:S.loc,ch:null,topic:b.dataset.ctopic,text:""};S.loc=null;render();window.scrollTo(0,0);return}
});
app.addEventListener("input",function(e){
  var id=e.target.id;if(id!=="qtext"&&id!=="ltext")return;
  if(id==="qtext")S.q.text=e.target.value;else S.locs.text=e.target.value;
  var pos=e.target.selectionStart;render();var n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});

function render(){
  if(isLocAdmin()&&!S.loc&&S.tab!=="queue"){S.tab="loc";S.loc=LOCS[0]}
  var page=S.loc?renderCab():({home:renderHome,queue:renderQueue,locs:renderLocs,collab:renderCollab})[S.tab]();
  app.innerHTML='<div class="shell">'+side()+'<main class="main">'+page+'</main></div>'+tabbar();
  if(TG&&TG.BackButton){if(S.loc&&!isLocAdmin())TG.BackButton.show();else TG.BackButton.hide()}
}
if(TG&&TG.BackButton)TG.BackButton.onClick(function(){if(stack.length)closePanel();else if(S.loc)goBack()});
var lastPhone=PHONE.matches;
window.addEventListener("resize",function(){if(PHONE.matches!==lastPhone){lastPhone=PHONE.matches;if(ME&&D)render()}});

// ================= start =================
function bare(html){app.innerHTML='<div style="max-width:420px;margin:0 auto;padding:48px 16px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center"><img class="lh-l" src="img/logo-h.png" alt="Кебабця" style="height:56px"><img class="lh-d" src="img/logo-h-dark.png" alt="Кебабця" style="height:56px">'+html+'</div>'}
function showError(e){
  if(e&&e.data&&e.data.needCode){showCode();return}
  bare('<div class="muted">'+esc(e&&e.message?e.message:"Немає зв'язку з сервером")+'</div><button class="btn2" id="retry">Спробувати ще раз</button>');
  document.getElementById("retry").addEventListener("click",start);
}
function showCode(){
  bare('<div class="card" style="padding:18px 16px;display:flex;flex-direction:column;gap:12px;width:100%;text-align:left"><b style="font-size:17px">Потрібен код доступу</b><div class="muted">Попросіть код в адміністратора і введіть його тут.</div><input class="inp" id="code" placeholder="Наприклад, K7Q2M9XA" autocapitalize="characters" autocomplete="off"><button class="btnk" id="codeGo">Увійти</button></div>');
  document.getElementById("codeGo").addEventListener("click",function(){var btn=this;busy(btn,true);api("redeem",{code:document.getElementById("code").value}).then(start).catch(function(e){busy(btn,false);toast(e.message)})});
}
function start(){
  if(!TG||!TG.initData){bare('<div class="muted">Відкрийте апку через бота в Telegram: @kebabtsia_vidguky_bot, кнопка «Відгуки».</div>');return}
  bare('<div class="muted">Завантаження…</div>');
  api("me").then(function(me){ME=me;THEMES=me.topics;RESULTS=me.results;S.mk=me.today.slice(0,7);setWindow(S.mk);
    if(isLocAdmin())S.tab="loc";
    // links from the bot: ?tab=queue opens the queue, ?item=123 opens that complaint
    var q=new URLSearchParams(location.search),tab=q.get("tab"),item=+q.get("item");
    if(tab&&tabsFor().some(function(t){return t[0]===tab}))S.tab=tab;
    return loadMonth().then(function(){if(item&&items.some(function(r){return r.id===item}))openItem(item)})}).catch(showError);
}
start();
})();
</script>
