# Deploys the server to Supabase on every push that touches supabase/: database changes, then functions,
# then points the Telegram bot at the new functions. Skips itself until PROJECT_REF and two repository secrets are set:
# SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (README → «Секрети»).
name: Deploy server

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy

env:
  PROJECT_REF: "obpmsgxanigythxkvrmh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Ready?
        id: check
        run: |
          if [[ "$PROJECT_REF" == __* || -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::notice::Сервер ще не налаштований (адреса проєкту або секрети GitHub). Пропускаю."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: 2.120.0
      - name: Link project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Database changes
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --include-all
      - name: Functions
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Connect the Telegram bot
        if: steps.check.outputs.ready == 'true'
        run: |
          out=$(curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/bot?setup=1") && echo "::notice title=Bot::$out" \
            || echo "::warning::Бот ще не підключений: додайте TELEGRAM_BOT_TOKEN у Supabase → Edge Functions → Secrets і запустіть цей workflow ще раз."
      - name: Connect the assistant bot
        if: steps.check.outputs.ready == 'true'
        run: |
          out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/asystent?setup=1")
          echo "::notice title=Assistant bot::$out"
      - name: Announcements
        if: steps.check.outputs.ready == 'true'
        run: |
          out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/bot?announce=survey-roman")
          echo "::notice title=Announce::$out"
          out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/bot?announce=survey-start-roman")
          echo "::notice title=Survey start::$out"
          for who in anya olena; do
            out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/bot?announce=survey-start-$who")
            echo "::notice title=Survey start $who::$out"
          done
          out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/bot?announce=tour-start-yura")
          echo "::notice title=Tour start yura::$out"
          out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/bot?report=1")
          echo "::notice title=Morning report::$out"
          out=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/bot?sheet=1")
          echo "::notice title=Sheet::$out"
      - name: Google matches
        if: steps.check.outputs.ready == 'true'
        run: |
          curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/google" || true; echo
          curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/google?list=1" | python3 -c "
          import json,sys
          print('::notice title=Google::'+'%0A'.join(json.load(sys.stdin)))
          " || true
      - name: Poster
        if: steps.check.outputs.ready == 'true'
        run: |
          curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/poster" | python3 -c "
          import json,sys
          for k,v in json.load(sys.stdin).items(): print('::notice title=Poster '+k+'::'+json.dumps(v,ensure_ascii=False)[:1800])
          " || true
      - name: Telegram groups
        if: steps.check.outputs.ready == 'true'
        run: |
          curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/bot?chats=1" | python3 -c "
          import json,sys
          rows=json.load(sys.stdin)
          print('::notice title=Groups::'+('%0A'.join(rows) if rows else 'бот ще не доданий у жодну групу'))
          " || true
