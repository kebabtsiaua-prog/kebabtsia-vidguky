# The free Supabase plan pauses a project after 7 quiet days. One request a day keeps it awake.
name: Keep server awake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ref="obpmsgxanigythxkvrmh"
          [[ "$ref" == __* ]] && { echo "Сервер ще не налаштований"; exit 0; }
          curl -fsS "https://$ref.supabase.co/functions/v1/api"
      - name: Google ratings
        run: |
          ref="obpmsgxanigythxkvrmh"
          [[ "$ref" == __* ]] && exit 0
          out=$(curl -sS "https://$ref.supabase.co/functions/v1/google")
          echo "$out"
          echo "::notice title=Google::$out"
      - name: Poster checks
        run: |
          ref="obpmsgxanigythxkvrmh"
          out=$(curl -sS "https://$ref.supabase.co/functions/v1/poster")
          echo "::notice title=Poster::$out"
