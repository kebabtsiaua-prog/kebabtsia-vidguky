<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  :root { --fg:#16141F; --hint:#8D8A99; --line:#ECEBF1; --acc:#6D3BF5; --good:#1F9D5C; --good-soft:#E3F5EB; --bad:#E5484D; --bad-soft:#FDECEC; --bg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#F2F1F6; --hint:#7F7C8C; --line:#262531; --acc:#8B66FF; --good:#3CC57F; --good-soft:#17301F; --bad:#FF6B6F; --bad-soft:#3A1F24; --bg:#18171F; } }
  body { width: 300px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 16px; margin: 0 0 10px; }
  label { display: block; color: var(--hint); font-size: 12px; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--bg); color: var(--fg); }
  button { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; background: var(--acc); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; color: var(--acc); border: 1px solid var(--line); }
  #status { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  #status.ok { background: var(--good-soft); color: var(--good); }
  #status.bad { background: var(--bad-soft); color: var(--bad); }
  #status:empty { display: none; }
  .hint { color: var(--hint); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>🧩 Glovo і Bolt → бот «Відгуки»</h1>
  <div id="status"></div>
  <div id="bolt" class="hint"></div>
  <div id="keybox">
    <label for="key">Ключ із бота (надішліть боту /glovo_key)</label>
    <input id="key" placeholder="123456789.abcd…" autocomplete="off">
    <button id="save">Зберегти ключ</button>
  </div>
  <button id="run">Забрати звіт зараз</button>
  <button id="open" class="ghost">Відкрити звіти Glovo</button>
  <div class="hint">Щовечора о 18:50 розширення саме відкриває звіти Glovo і відгуки Bolt і надсилає їх боту. Chrome має бути відкритий, а ви увійшли в портал Glovo.</div>
  <script src="popup.js"></script>
</body>
</html>
